[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Tekiloua",email = "rasoanaivopietro@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.47.0,<0.48.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "bcrypt (==4.0.1)",
    "psycopg2 (>=2.9.12,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-multipart (>=0.0.29,<0.0.30)",
    "pydantic (>=2.13.4,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "wordfreq (>=3.1.1,<4.0.0)",
    "langdetect (>=1.0.9,<2.0.0)",
    "pdf2image (>=1.17.0,<2.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "pytesseract (>=0.3.13,<0.4.0)",
    "opencv-python (>=4.13.0.92,<5.0.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "pymupdf (>=1.28.0,<2.0.0)"
]

[tool.poetry]
packages = [{include = "backend", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
